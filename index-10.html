html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:10;background:rgba(5,6,10,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
header a.brand{color:var(--text);text-decoration:none;letter-spacing:.14em;font-weight:700;font-size:13px}
nav{display:flex;gap:14px;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;font-size:13px;padding:8px 2px;min-height:44px;display:inline-flex;align-items:center}
nav a:hover,nav a:focus{color:var(--text)}
header a.brand{white-space:nowrap}
@media(max-width:640px){header{flex-wrap:wrap;row-gap:0}nav{width:100%;overflow-x:auto;flex-wrap:nowrap;gap:18px;white-space:nowrap}nav a{flex:0 0 auto}}
main{max-width:760px;margin:0 auto;padding:0 16px 60px}
.eyebrow{color:var(--blue);letter-spacing:.2em;font-size:11px;text-transform:uppercase;margin:36px 0 8px}
h1{font-size:44px;line-height:1.05;margin:6px 0 12px}
h1 span{color:var(--amber)}
h2{font-size:26px;line-height:1.2;margin:6px 0 12px}
p.lead{font-size:18px}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--blue);background:#1c1d25;color:var(--text);text-decoration:none;border-radius:6px;font-size:15px;cursor:pointer}
.btn:focus,.opt:focus,a:focus,button:focus{outline:2px solid var(--amber);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--amber));transition:width .4s}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--text);display:block}
.card .img{height:170px;background:#000 center/cover no-repeat}
.card .body{padding:14px}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.tag.mars{color:var(--amber)}
.card h3{margin:4px 0 4px;font-size:21px}
.stamp{float:right;font-size:12px;border:1px solid var(--ok);color:var(--ok);padding:2px 8px;border-radius:99px}
figure{margin:18px 0}
figure img{width:100%;max-height:72vh;object-fit:contain;border-radius:8px;display:block;background:#000}
figcaption{font-size:13px;color:var(--mute);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:20px 0}
.stats b{display:block;font-size:22px}
.stats small{color:var(--mute);font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:0 14px}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details p{margin:0 0 14px;color:var(--mute)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:14px;margin:8px 0;font-size:16px;min-height:48px;cursor:pointer}
.opt.right{border-color:var(--ok);background:#0c2a20}
.opt.wrong{border-color:var(--bad);background:#2a1210}
.fb{margin:10px 0;color:var(--mute);font-size:15px}
.fb b.ok{color:var(--ok)}.fb b.no{color:var(--bad)}
.note{font-size:13px;color:var(--mute);border-top:1px solid var(--line);margin-top:30px;padding-top:14px}
footer{border-top:1px solid var(--line);padding:20px 16px;color:var(--mute);font-size:13px;text-align:center}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.slot{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center}
.slot.got{border:1px solid var(--ok);background:#0c2a20}
.slot .s{font-size:26px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tl{border-left:2px solid var(--line);margin:20px 0 20px 8px;padding-left:18px}
.tl .ev{position:relative;margin:0 0 22px}
.tl .ev:before{content:"";position:absolute;left:-26px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--bg)}
.tl .ev.mars:before{background:var(--amber)}
.tl .yr{font-weight:700;font-size:18px}
.tl a{font-size:13px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;min-height:44px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:15px;cursor:pointer}
.tabs button.on{border-color:var(--blue);background:#1c1d25}
.map{width:100%;background:#08090d;border:1px solid var(--line);border-radius:10px;display:block}
.pin{cursor:pointer}
.pin:focus circle,.pin:hover circle{stroke:#fff;stroke-width:2}
.pinfo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;min-height:90px}
.cert{border:2px solid var(--amber);border-radius:12px;padding:24px 16px;text-align:center;background:#0f1118;margin:18px 0}
.cert h2{margin:6px 0}
.cert input{background:#05060a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;width:100%;max-width:320px;text-align:center;margin:8px 0}
dl.gl dt{font-weight:700;margin-top:16px}
dl.gl dd{margin:2px 0 0;color:var(--mute)}
.gin{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px;width:100%;max-width:360px;margin:6px 0}
ul.facts{padding-left:20px;color:var(--mute)}
ul.facts li{margin:9px 0}
ul.facts li::marker{color:var(--blue)}
.zoomable{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:72vh;border-radius:8px}
#lb p{color:var(--mute);font-size:13px;max-width:700px;text-align:center}
#lb button{position:absolute;top:12px;right:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.scene{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0;opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.scene.in{opacity:1;transform:none}
.scene h1{font-size:46px}
.scene h2{font-size:32px}
.scene .big{font-size:60px;font-weight:700;color:var(--blue);line-height:1.1}
#sp{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--amber));width:0;z-index:60}
@media (prefers-reduced-motion:reduce){.scene{opacity:1;transform:none}}
@media print{body::before{display:none}header,footer,.noprint{display:none!important}body{background:#fff;color:#000}.cert{background:#fff;border-color:#000;color:#000}.cert input{border:none;color:#000;background:#fff}.mute{color:#333}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ---- v2: themes ---- */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1s}
body[data-theme]::after{opacity:1}
header{background:var(--hdr,rgba(5,6,10,.9))}
body[data-theme=moon]{--blue:#e4e4e8;--amber:#b9bcc8;--bg:#050506;--card:#111113;--line:#303034;--hdr:rgba(5,5,6,.9)}
body[data-theme=moon]::before{filter:grayscale(1)}
body[data-theme=moon]::after{background:radial-gradient(ellipse 140% 26% at 50% 114%,rgba(210,210,220,.3),transparent 72%)}
body[data-theme=mars]{--blue:#f3c9a8;--amber:#ff7a3a;--bg:#150805;--card:#21100a;--line:#4d2619;--hdr:rgba(21,8,5,.9)}
body[data-theme=mars]::after{background:radial-gradient(circle 44px at 80% 140px,rgba(215,225,235,.7),rgba(215,225,235,0) 100%),radial-gradient(circle 120px at 80% 140px,rgba(215,225,235,.12),transparent),linear-gradient(to bottom,#190806 0,#2f1209 45%,#6e2a13 85%,#9c4320 100%)}
body[data-theme=deep]{--blue:#c1caff;--amber:#9a86ff;--bg:#04050f;--card:#0c0e22;--line:#282d58;--hdr:rgba(4,5,15,.9)}
body[data-theme=deep]::before{filter:hue-rotate(200deg)}
body[data-theme=deep]::after{background:radial-gradient(ellipse at 18% 28%,rgba(110,80,255,.28),transparent 55%),radial-gradient(ellipse at 82% 72%,rgba(40,160,255,.2),transparent 55%)}
.card .img.ph{background:radial-gradient(circle at 30% 30%,#8c8c92,#151518)}
.card .img.ph.mars{background:radial-gradient(circle at 30% 30%,#c2582c,#2a0f08)}
.card .img.ph.deep{background:radial-gradient(circle at 30% 30%,#6d74d8,#080a22)}
.sig{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(26px,8vw,44px);color:var(--amber);line-height:1.2;margin:8px 0 14px}
.sig::after{content:"";display:inline-block;width:.5em;height:1em;margin-left:8px;vertical-align:-.12em;background:var(--amber);animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media(prefers-reduced-motion:reduce){.sig::after{animation:none}}
.sw{width:100%;height:110px;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0}
input[type=range]{width:100%;accent-color:var(--amber);margin:6px 0 10px;height:36px}
/* ---- v3: opening, hero, foundation ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
main>*{animation:rise .8s both}
.hero{position:relative;margin:0 -16px 26px;padding:64px 16px 34px;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-6%;z-index:-2;background:var(--hi) center/cover;opacity:.6;animation:kb 28s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,6,10,.5),var(--bg))}
@keyframes kb{to{transform:scale(1.12) translate(-2%,1%)}}
.why{display:grid;gap:12px;margin:12px 0 22px}
.why>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.why b{color:var(--blue)}.why p{margin:6px 0 0;color:var(--mute)}
@media(prefers-reduced-motion:reduce){main>*,.hero::before{animation:none}}
/* ---- v2: intro ---- */
#intro{position:fixed;inset:0;z-index:100;background:#02030a;overflow:hidden}
#intro.go{animation:ifade .5s .85s forwards}
@keyframes ifade{to{opacity:0}}
#sf{position:absolute;inset:0;width:100%;height:100%}
#intro .itx{position:absolute;left:0;right:0;top:13vh;padding:0 24px;text-align:center;max-width:560px;margin:0 auto}
#intro .l1,#intro .l2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,7vw,44px);line-height:1.2;margin:0 0 10px;opacity:0;animation:iin 1.4s forwards}
#intro .l1{animation-delay:.6s}
#intro .l2{animation-delay:2.6s;color:var(--amber)}
#intro .pick{opacity:0;animation:iin 1.2s 4.4s forwards;margin-top:34px;color:var(--mute)}
@keyframes iin{to{opacity:1}}
.orbs{display:flex;justify-content:center;gap:18px;margin-top:16px}
.orbs button{background:none;border:0;color:var(--text);font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px;min-width:80px}
.o{display:block;width:64px;height:64px;border-radius:50%;transition:transform .3s}
.orbs button:hover .o,.orbs button:focus .o{transform:scale(1.12)}
.o.moon{background:radial-gradient(circle at 35% 30%,#f4f2ec,#a3a3a6 55%,#34343a);box-shadow:0 0 24px rgba(220,220,230,.35)}
.o.mars{background:radial-gradient(circle at 35% 30%,#f2a574,#b8481f 55%,#4a1a0c);box-shadow:0 0 24px rgba(226,115,61,.4)}
.o.deep{background:radial-gradient(circle at 35% 30%,#c5ccff,#4a4fb8 55%,#0b0c2c);box-shadow:0 0 24px rgba(120,130,255,.4)}
#intro .skip{position:absolute;top:12px;right:12px;z-index:2}
#intro.go .itx,#intro.go .skip{opacity:0!important;transition:opacity .5s}
#intro .kick{letter-spacing:.5em;font-size:12px;text-transform:uppercase;color:var(--mute);margin:0 0 10px;opacity:0;animation:iin 1.2s .4s forwards}
#intro .ttl{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(32px,10vw,84px);letter-spacing:.08em;margin:0 0 14px;opacity:0;text-shadow:0 0 34px rgba(226,115,61,.5);animation:iin 2.2s .8s forwards}
#intro .l2{font-size:clamp(16px,4.6vw,22px);animation-delay:2.6s;color:var(--text)}
#intro .go-b{margin-top:26px;opacity:0;animation:iin 1s 3.8s forwards}
#intro .pick{display:none;animation:none;opacity:0;margin-top:30px}
#intro .pick.show{display:block;animation:iin .9s forwards}
@media(prefers-reduced-motion:reduce){#intro .kick,#intro .ttl,#intro .l2,#intro .go-b{animation:none;opacity:1}#intro .pick.show{animation:none;opacity:1}}

function quiz(m){
  let qi=0,score=0;const box=document.getElementById("quiz");
  function show(){
    if(qi>=m.q.length){
      const need=m.q.length>3?3:2,won=score>=need; if(won){mem[m.id]=true;save(mem)}
      box.innerHTML=`<p class="lead"><b>${score} of ${m.q.length}</b></p><p class="fb">${won?'<b class="ok">Stamp earned.</b> Open your <a href="#/passport">passport</a> to see it.':'You need ${need} or more for the stamp.'}</p><button class="btn" id="again">Try again</button>`;
      document.getElementById("again").onclick=()=>{qi=0;score=0;show()};return;
    }
    const q=m.q[qi];
    box.innerHTML=`<div class="tag">Question ${qi+1} of ${m.q.length}</div><p class="lead">${q[0]}</p>`+q[1].map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)} &nbsp; ${o}</button>`).join("")+`<div class="fb" id="fb" aria-live="polite"></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===q[2]; if(ok)score++;
      box.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add("right");else if(x===b)x.classList.add("wrong")});
      document.getElementById("fb").innerHTML=(ok?'<b class="ok">Correct.</b> ':'<b class="no">Not quite.</b> ')+q[3]+'<br><br><button class="btn" id="nx">'+(qi===m.q.length-1?"See score":"Next question")+'</button>';
      document.getElementById("nx").onclick=()=>{qi++;show()};
    });
  }
  show();
}

      g+=`<g class="pin" tabindex="0" role="button" aria-label="${p[0]}" data-w="${w}" data-i="${i}"><circle cx="${x}" cy="${y}" r="6" fill="${col}" stroke="#08090d"/><text x="${(x>250||x<=180)?x-9:x+9}" y="${y+3}" text-anchor="${(x>250||x<=180)?'end':'start'}" fill="#f1efe9" font-size="9.5">${p[0]}</text></g>`});
    svg.innerHTML=g;
    svg.querySelectorAll(".pin").forEach(el=>{const f=()=>{const p=PINS[el.dataset.w][el.dataset.i];const mm=M.find(x=>x.id===p[1]);pi.innerHTML=`<img src="${mm.img}" alt="${esc(mm.n)}" style="width:100%;max-height:170px;object-fit:cover;border-radius:8px;margin-bottom:8px"><b>${p[0]}</b><p class="mute">${p[4]}</p><a href="#/m/${p[1]}">Read the story &rarr;</a>`};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  }
  draw("moon");
  document.getElementById("tm").onclick=()=>{draw("moon");tm.className="on";tr.className="";pi.innerHTML='<span class="mute">Select a pin.</span>'};
  document.getElementById("tr").onclick=()=>{draw("mars");tr.className="on";tm.className="";pi.innerHTML='<span class="mute">Select a pin.</span>'};
}
const GL=[
["Sol","A Martian day, about 24 hours 39 minutes long. Rover missions are counted in sols."],
["Heliopause","The boundary where the Sun's wind gives way to interstellar space. Voyager 1 crossed it in 2012."],
["APXS","Alpha Proton X-ray Spectrometer. Sojourner's tool for measuring the chemistry of rocks."],
["Retroreflector","A mirror array that sends light straight back to its source. Apollo 11's has 100 corner cubes and needs no power."],
["Seismometer","An instrument that detects ground shaking, such as moonquakes."],
["Soft landing","Touching down gently enough that the spacecraft survives, as Surveyor 3 did."],
["Golden Record","A record carried by Voyager with 115 images of Earth, plus sounds and greetings."],
["Spherules","Tiny round mineral grains. Opportunity's 'blueberries' are an example."],
["EASEP","Early Apollo Scientific Experiments Package, the instruments Apollo 11 left on the Moon."],
["Hematite","An iron-rich mineral that often forms in the presence of water. Opportunity found it in Meridiani Planum."],
["Silica","A mineral made of silicon and oxygen. Spirit found silica-rich soil, a sign of past water."],
["Descent stage","The lower part of the lunar module. It stayed on the Moon when the astronauts left."],
["Lander and rover","A lander touches down and stays put. A rover drives around. Pathfinder was the lander and Sojourner the rover."],
["UTC","Coordinated Universal Time, a world time standard. Some dates differ by a day between US time and UTC."],
["Interstellar space","The space between the stars, beyond the Sun's heliosphere."]
];
function glossary(){
  app.innerHTML=`<div class="eyebrow">Glossary</div><h1 style="font-size:36px">Words worth knowing</h1><label class="mute" for="gq">Search a word</label><br><input id="gq" class="gin" placeholder="e.g. sol" autocomplete="off"><dl class="gl" id="gl"></dl>`;
  const list=GL.slice().sort((a,b)=>a[0].localeCompare(b[0])),dl=document.getElementById("gl"),q=document.getElementById("gq");
  function draw(){const v=(q.value||"").toLowerCase();const r=list.filter(g=>!v||g[0].toLowerCase().includes(v)||g[1].toLowerCase().includes(v));dl.innerHTML=r.length?r.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join(""):'<p class="mute">No matching word.</p>'}
  q.oninput=draw;draw();
}
const lb=document.getElementById("lb"),lbi=lb.querySelector("img"),lbp=lb.querySelector("p"),sp=document.getElementById("sp");
function openLb(src,alt,cap){lbi.setAttribute("src",src);lbi.alt=alt;lbp.textContent=cap;lb.classList.add("on");document.getElementById("lbx").focus()}
function closeLb(){lb.classList.remove("on");lbi.removeAttribute("src")}
document.getElementById("lbx").onclick=closeLb;
lb.addEventListener("click",e=>{if(e.target===lb)closeLb()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();const t=e.target;if((e.key==="Enter"||e.key===" ")&&t&&t.dataset&&t.dataset.zoom){e.preventDefault();t.click()}});
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-zoom]");if(t)openLb(t.getAttribute("src"),t.alt,t.dataset.cap||"")});
const canSpeak="speechSynthesis" in window;
function stopSpeak(){if(canSpeak)speechSynthesis.cancel()}
function speakText(t,btn){if(!canSpeak)return;if(speechSynthesis.speaking){speechSynthesis.cancel();btn.textContent="Listen";return}
  const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.95;u.onend=()=>{btn.textContent="Listen"};speechSynthesis.speak(u);btn.textContent="Stop"}
function mText(m){return m.n+". "+m.line+" "+m.intro+" "+m.ctx+" "+(FACTS[m.id]||[]).join(" ")+" "+m.ev.map(e=>e[0]+". "+e[1]).join(" ")+" The last signal. "+(LAST[m.id]?LAST[m.id][0]+". "+LAST[m.id][1]:"")}
function story(id){
  const i=M.findIndex(x=>x.id===id);if(i<0)return home();
  const m=M[i],next=M[(i+1)%M.length],sc=[];
  sc.push(`<div class="tag ${m.where==="Mars"?"mars":""}">Explorer ${String(i+1).padStart(2,"0")} &middot; ${m.where}</div><h1>${m.n}</h1><p class="lead">${m.line}</p>${canSpeak?'<div class="row"><button class="btn" id="ls">Listen to this story</button></div>':''}<p class="mute">Scroll to begin &darr;</p>`);
  sc.push(`<div class="tag">Chapter 1: Arrival</div><p class="lead">${m.intro}</p>`);
  if(m.img)sc.push(`<figure>${imgTag(m)}<figcaption>${m.cap}<br>Credit: ${m.credit} &middot; ${m.cid}. Tap the photo to zoom.</figcaption></figure>`);
  m.stats.forEach(t=>sc.push(`<div class="big">${t[0]}</div><p class="lead">${t[1]}</p>`));
  sc.push(factsHTML(m));
  sc.push(`<div class="tag">Chapter 2: The mission</div><p class="lead">${m.ctx}</p>`);
  m.ev.forEach(e=>sc.push(`<div class="tag">Chapter 3: The evidence</div><h2>${e[0]}</h2><p class="lead mute">${e[1]}</p>`));
  if(LAST[m.id])sc.push(`<div class="tag">Chapter 4: The last signal</div><div class="sig">${LAST[m.id][0]}</div><p class="lead">${LAST[m.id][1]}</p>`);
  sc.push(`<div class="tag">Chapter 5: What remains</div><h2>What remains is a story worth knowing.</h2><p class="mute">Now test what you learned and earn the stamp.</p><div class="row"><a class="btn" href="#/m/${m.id}">Take the quiz</a><a class="btn" href="#/story/${next.id}">Next story: ${next.n} &rarr;</a></div>`);
  app.innerHTML=`<p><a href="#/m/${m.id}">&larr; Mission page</a></p>`+sc.map(h=>`<section class="scene">${h}</section>`).join("");
  const scenes=app.querySelectorAll(".scene");
  if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in")}),{threshold:.2});scenes.forEach(x=>io.observe(x))}
  else scenes.forEach(x=>x.classList.add("in"));
  const ls=document.getElementById("ls");if(ls)ls.onclick=()=>speakText(mText(m),ls);
}
window.addEventListener("scroll",()=>{if(location.hash.indexOf("#/story/")===0){const h=document.documentElement.scrollHeight-window.innerHeight;sp.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+"%"}});
function route(){
  stopSpeak();closeLb();sp.style.width="0";
  const h=location.hash.replace(/^#/,"")||"/";
  if(h.startsWith("/story/"))story(h.slice(7));
  else if(h.startsWith("/m/"))mission(h.slice(3));
  else if(h==="/signal")signal();
  else if(h==="/passport")passport();
  else if(h==="/credits")credits();
  else if(h==="/timeline")timeline();
  else if(h==="/map")map();
  else if(h==="/glossary")glossary();
  else home();
  if(h!=="missions")window.scrollTo(0,0);
  applyTheme(h);
  document.title="Project Afterlight";
}
const DKEY="afterlight-decoded-v1";
let decoded=[];try{decoded=JSON.parse(localStorage.getItem(DKEY)||"[]")}catch(e){}
function signal(){
  const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const left=M.filter(m=>!decoded.includes(m.id)),pool=left.length?left:M;
  const pick=pool[Math.floor(Math.random()*pool.length)],T=15+Math.floor(Math.random()*71);
  app.innerHTML=`<div class="eyebrow">Interactive</div><h1 style="font-size:38px">Reconnect the signal</h1><p class="lead">A probe is calling home.</p><p class="mute">The puzzle is fictional. The mission fact you decode is real. Transmissions decoded: <b>${decoded.length} of ${M.length}</b>.</p><div id="sg"></div>`;
  const box=document.getElementById("sg");
  tune();
  function tune(){
    box.innerHTML='<div class="tag">Step 1: Tune the signal</div><canvas id="sw" class="sw" width="600" height="140"></canvas><input id="tn" type="range" min="0" max="100" value="8" aria-label="Tuning dial"><p class="mute" id="rd">Slide the dial until the wave is clean.</p><button class="btn" id="lk">Lock signal</button>';
    const cv=document.getElementById("sw"),cx=cv.getContext("2d"),tn=document.getElementById("tn"),rd=document.getElementById("rd"),lk=document.getElementById("lk");
    const clar=()=>Math.max(0,1-Math.abs(+tn.value-T)/30);
    function draw(now){
      const c=clar(),W=cv.width,H=cv.height;cx.clearRect(0,0,W,H);cx.lineWidth=2;cx.strokeStyle=c>.9?"#7dffb0":"#e2733d";cx.beginPath();
      for(let x=0;x<=W;x+=3){const y=H/2+Math.sin(x/28+now/300)*H*.3*c+(Math.random()-.5)*H*.8*(1-c);x?cx.lineTo(x,y):cx.moveTo(x,y)}
      cx.stroke();rd.textContent=c>.9?"Clear signal. Lock it in.":c>.5?"Getting closer...":"Mostly static...";
    }
    function loop(now){if(!document.body.contains(cv))return;draw(now);if(!rm)requestAnimationFrame(loop)}
    loop(0);tn.oninput=()=>{if(rm)draw(0)};
    lk.onclick=()=>{if(clar()>.9)chain();else rd.textContent="Not locked yet. Keep tuning until the wave is clean."};
  }
  function chain(){
    const parts=["Power source","Computer","Transmitter","Antenna","Deep Space Network dish on Earth"];
    let order=parts.map((p,i)=>i),next=0;
    do{order.sort(()=>Math.random()-.5)}while(order.every((v,i)=>v===i));
    box.innerHTML='<div class="tag">Step 2: Rebuild the chain</div><p class="lead">Tap the parts in the order the signal travels, from the spacecraft to Earth.</p><div id="pl">'+order.map(i=>`<button class="opt" data-i="${i}">${parts[i]}</button>`).join("")+'</div><div class="fb" id="cf" aria-live="polite"></div>';
    const pl=document.getElementById("pl"),cf=document.getElementById("cf");
    pl.onclick=e=>{
      const b=e.target.closest(".opt");if(!b||b.disabled)return;
      if(+b.dataset.i===next){b.disabled=true;b.classList.add("right");b.innerHTML=(next+1)+" &nbsp; "+parts[next];next++;cf.textContent="";if(next===parts.length)reveal()}
      else cf.textContent=next?"Not yet. What comes after the "+parts[next-1].toLowerCase()+"?":"Not yet. Where does the signal start?";
    };
  }
  function reveal(){
    if(!decoded.includes(pick.id)){decoded.push(pick.id);try{localStorage.setItem(DKEY,JSON.stringify(decoded))}catch(e){}}
    document.body.dataset.theme=pick.where==="Moon"?"moon":pick.where==="Mars"?"mars":"deep";
    const L=LAST[pick.id];
    box.innerHTML=`<div class="tag">Transmission decoded</div><h2>${pick.n}</h2>${L?`<div class="sig">${L[0]}</div><p class="lead">${L[1]}</p>`:`<p class="lead">${pick.line}</p>`}${pick.img?`<figure><img src="${pick.img}" alt="${esc(pick.n)}" loading="lazy"><figcaption>${pick.cap}<br>Credit: ${pick.credit} &middot; ${pick.cid}</figcaption></figure>`:""}<p class="mute">${pick.intro}</p><p class="mute">Transmissions decoded: ${decoded.length} of ${M.length}</p><div class="row"><a class="btn" href="#/story/${pick.id}">Open the full story</a><button class="btn" id="ag">Decode another</button></div><p><a href="${pick.src[0][1]}" target="_blank" rel="noopener">${pick.src[0][0]} &#8599;</a></p>`;
    document.getElementById("ag").onclick=signal;
  }
}
let userTheme="";
function applyTheme(h){
  let t=userTheme;
  const mm=h.match(/^\/(?:m|story)\/(.+)$/);
  if(mm){const m=M.find(x=>x.id===mm[1]);if(m)t=m.where==="Moon"?"moon":m.where==="Mars"?"mars":"deep"}
  if(t)document.body.dataset.theme=t;else delete document.body.dataset.theme;
}
function startIntro(){
  let seen=false;try{seen=sessionStorage.getItem("al-intro")}catch(e){}
  if(seen||(location.hash.replace(/^#/,"")||"/")!=="/")return;
  const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const el=document.createElement("div");el.id="intro";el.setAttribute("role","dialog");el.setAttribute("aria-label","Welcome to Project Afterlight");
  el.innerHTML='<canvas id="sf"></canvas><button class="btn skip">Skip</button><div class="itx"><p class="kick">Project</p><h1 class="ttl">AFTERLIGHT</h1><p class="l2">Every mission ends. Its discoveries endure.</p><button class="btn go-b" id="bg">Begin expedition</button><div class="pick"><p>Where do you want to listen first?</p><div class="orbs"><button data-t="moon"><i class="o moon"></i>Moon</button><button data-t="mars"><i class="o mars"></i>Mars</button><button data-t="deep"><i class="o deep"></i>Deep space</button></div></div></div>';
  document.body.appendChild(el);document.body.style.overflow="hidden";
  const cv=el.querySelector("#sf"),cx=cv.getContext("2d");let W,H,v=.0007,run=true,warp=false,fin=false,last=-9999;const R=[];
  const S=Array.from({length:240},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()}));
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
  function frame(){
    if(!run)return;
    cx.clearRect(0,0,W,H);cx.fillStyle="#fff";cx.strokeStyle="#fff";
    const k=Math.max(W,H)*.09;
    for(const s of S){
      const pz=s.z;s.z-=v;
      if(s.z<=.02){s.x=Math.random()*2-1;s.y=Math.random()*2-1;s.z=1;continue}
      const x=W/2+s.x/s.z*k*5,y=H/2+s.y/s.z*k*5;
      cx.globalAlpha=Math.min(1,(1-s.z)*1.4+.15);
      if(warp){const px=W/2+s.x/pz*k*5,py=H/2+s.y/pz*k*5;cx.lineWidth=1.2;cx.beginPath();cx.moveTo(px,py);cx.lineTo(x,y);cx.stroke()}
      else cx.fillRect(x,y,1.6,1.6);
    }
    if(!warp){
      const ox=W/2,oy=H*.8,mx=Math.max(W,H)*.55,now=performance.now();
      if(!rm&&now-last>1900){R.push(0);last=now}
      if(rm&&!R.length)R.push(mx*.25,mx*.55);
      cx.lineWidth=1;
      for(let i=R.length-1;i>=0;i--){
        const r=R[i];if(!rm)R[i]+=mx/260;if(r>mx){R.splice(i,1);continue}
        cx.globalAlpha=.55*(1-r/mx);cx.strokeStyle="#e2733d";cx.beginPath();cx.arc(ox,oy,r,0,6.2832);cx.stroke();
      }
      const g=cx.createRadialGradient(ox,oy,0,ox,oy,26);g.addColorStop(0,"rgba(255,190,150,.9)");g.addColorStop(1,"rgba(226,115,61,0)");
      cx.globalAlpha=rm?1:.7+.3*Math.sin(now/420);cx.fillStyle=g;cx.beginPath();cx.arc(ox,oy,26,0,6.2832);cx.fill();
      cx.fillStyle="#fff";cx.fillRect(ox-1.5,oy-1.5,3,3);
    }
    requestAnimationFrame(frame);
  }
  frame();if(rm)run=false;
  function end(t){run=false;removeEventListener("resize",size);el.remove();document.body.style.overflow="";if(t)location.hash="#missions"}
  function done(t){
    if(fin)return;fin=true;
    try{sessionStorage.setItem("al-intro","1")}catch(e){}
    if(t){userTheme=t;document.body.dataset.theme=t}
    if(t&&!rm){warp=true;el.classList.add("go");const iv=setInterval(()=>{v=Math.min(v*1.2+.0004,.05)},60);setTimeout(()=>{clearInterval(iv);end(t)},1400)}
    else end(t);
  }
  const bg=el.querySelector("#bg");bg.onclick=()=>{bg.style.display="none";el.querySelector(".pick").classList.add("show");el.querySelector("[data-t]").focus()};
  el.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>done(b.dataset.t));
  el.querySelector(".skip").onclick=()=>done("");
  addEventListener("keydown",e=>{if(e.key==="Escape")done("")});
}
window.addEventListener("hashchange",route);
route();
startIntro();
</script>
