html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:10;background:rgba(5,6,10,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
header a.brand{color:var(--text);text-decoration:none;letter-spacing:.14em;font-weight:700;font-size:13px}
nav{display:flex;gap:14px;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;font-size:13px;padding:8px 2px;min-height:44px;display:inline-flex;align-items:center}
nav a:hover,nav a:focus{color:var(--text)}
header a.brand{white-space:nowrap}
@media(max-width:640px){header{flex-wrap:wrap;row-gap:0}nav{width:100%;overflow-x:auto;flex-wrap:nowrap;gap:18px;white-space:nowrap}nav a{flex:0 0 auto}}
main{max-width:760px;margin:0 auto;padding:0 16px 60px}
.eyebrow{color:var(--blue);letter-spacing:.2em;font-size:11px;text-transform:uppercase;margin:36px 0 8px}
h1{font-size:44px;line-height:1.05;margin:6px 0 12px}
h1 span{color:var(--amber)}
h2{font-size:26px;line-height:1.2;margin:6px 0 12px}
p.lead{font-size:18px}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--blue);background:#1c1d25;color:var(--text);text-decoration:none;border-radius:6px;font-size:15px;cursor:pointer}
.btn:focus,.opt:focus,a:focus,button:focus{outline:2px solid var(--amber);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--amber));transition:width .4s}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--text);display:block}
.card .img{height:170px;background:#000 center/cover no-repeat}
.card .body{padding:14px}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.tag.mars{color:var(--amber)}
.card h3{margin:4px 0 4px;font-size:21px}
.stamp{float:right;font-size:12px;border:1px solid var(--ok);color:var(--ok);padding:2px 8px;border-radius:99px}
figure{margin:18px 0}
figure img{width:100%;max-height:72vh;object-fit:contain;border-radius:8px;display:block;background:#000}
figcaption{font-size:13px;color:var(--mute);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:20px 0}
.stats b{display:block;font-size:22px}
.stats small{color:var(--mute);font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:0 14px}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details p{margin:0 0 14px;color:var(--mute)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:14px;margin:8px 0;font-size:16px;min-height:48px;cursor:pointer}
.opt.right{border-color:var(--ok);background:#0c2a20}
.opt.wrong{border-color:var(--bad);background:#2a1210}
.fb{margin:10px 0;color:var(--mute);font-size:15px}
.fb b.ok{color:var(--ok)}.fb b.no{color:var(--bad)}
.note{font-size:13px;color:var(--mute);border-top:1px solid var(--line);margin-top:30px;padding-top:14px}
footer{border-top:1px solid var(--line);padding:20px 16px;color:var(--mute);font-size:13px;text-align:center}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.slot{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center}
.slot.got{border:1px solid var(--ok);background:#0c2a20}
.slot .s{font-size:26px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tl{border-left:2px solid var(--line);margin:20px 0 20px 8px;padding-left:18px}
.tl .ev{position:relative;margin:0 0 22px}
.tl .ev:before{content:"";position:absolute;left:-26px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--bg)}
.tl .ev.mars:before{background:var(--amber)}
.tl .yr{font-weight:700;font-size:18px}
.tl a{font-size:13px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;min-height:44px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:15px;cursor:pointer}
.tabs button.on{border-color:var(--blue);background:#1c1d25}
.map{width:100%;background:#08090d;border:1px solid var(--line);border-radius:10px;display:block}
.pin{cursor:pointer}
.pin:focus circle,.pin:hover circle{stroke:#fff;stroke-width:2}
.pinfo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;min-height:90px}
.cert{border:2px solid var(--amber);border-radius:12px;padding:24px 16px;text-align:center;background:#0f1118;margin:18px 0}
.cert h2{margin:6px 0}
.cert input{background:#05060a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;width:100%;max-width:320px;text-align:center;margin:8px 0}
dl.gl dt{font-weight:700;margin-top:16px}
dl.gl dd{margin:2px 0 0;color:var(--mute)}
.gin{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px;width:100%;max-width:360px;margin:6px 0}
ul.facts{padding-left:20px;color:var(--mute)}
ul.facts li{margin:9px 0}
ul.facts li::marker{color:var(--blue)}
.zoomable{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:72vh;border-radius:8px}
#lb p{color:var(--mute);font-size:13px;max-width:700px;text-align:center}
#lb button{position:absolute;top:12px;right:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.scene{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0;opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.scene.in{opacity:1;transform:none}
.scene h1{font-size:46px}
.scene h2{font-size:32px}
.scene .big{font-size:60px;font-weight:700;color:var(--blue);line-height:1.1}
#sp{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--amber));width:0;z-index:60}
@media (prefers-reduced-motion:reduce){.scene{opacity:1;transform:none}}
@media print{body::before{display:none}header,footer,.noprint{display:none!important}body{background:#fff;color:#000}.cert{background:#fff;border-color:#000;color:#000}.cert input{border:none;color:#000;background:#fff}.mute{color:#333}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

@keyframes enter{from{opacity:0;transform:translateY(10px)}}
#app.enter{animation:enter .45s ease both}
.hero{position:relative;margin:0 -16px;padding:56px 16px 28px;isolation:isolate;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,6,10,.3) 0,rgba(5,6,10,.8) 62%,var(--bg) 100%),url("apollo-11.jpg") center 28%/cover no-repeat}
.hero .eyebrow{margin-top:0}
.hero h1{font-size:50px}
.mhero{position:relative;margin:0 -16px 16px;padding:110px 16px 16px;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start}
.mhero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(5,6,10,.35) 0,rgba(5,6,10,.78) 55%,var(--bg) 100%),var(--bgimg) center/cover no-repeat}
.mhero .eyebrow{margin:0 0 8px}
.mhero h1{font-size:42px;margin:8px 0 4px}
.st{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #5a5c66;border-radius:99px;padding:3px 10px;color:var(--mute);background:rgba(5,6,10,.65)}
.st.warm{border-color:var(--amber);color:var(--amber)}
.st.live{border-color:var(--ok);color:var(--ok)}
.diag{background:#08090d;border:1px solid var(--line);border-radius:10px;padding:8px}
.diag svg{width:100%;height:auto;display:block}
.dp{cursor:pointer}
.dp circle{fill:var(--amber);stroke:#08090d;stroke-width:2}
.dp text{fill:#05060a;font-size:12px;font-weight:700;text-anchor:middle}
.dp:focus{outline:none}
.dp:focus circle,.dp.on circle{stroke:#fff;stroke-width:3}
@media (prefers-reduced-motion:reduce){#app.enter{animation:none}}

/* ===== v3 cinematic restyle ===== */
:root{--disp:"Fjalla One","Oswald","Arial Narrow",Impact,sans-serif;--serif:"Playfair Display",Georgia,"Times New Roman",serif;--hud:"Rajdhani","Orbitron",system-ui,sans-serif}
header{min-height:56px;padding:8px 16px}
header a.brand{font-family:var(--disp);font-weight:400;font-size:17px;letter-spacing:.18em}
.mb{display:none;background:none;border:1px solid var(--line);color:var(--text);font-family:var(--hud);letter-spacing:.16em;text-transform:uppercase;font-size:13px;min-height:40px;padding:0 14px;border-radius:99px;cursor:pointer}
nav a{font-family:var(--hud);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
@media(max-width:700px){
 header{flex-wrap:nowrap;backdrop-filter:none;-webkit-backdrop-filter:none;background:#05060a}
 .mb{display:inline-flex;align-items:center}
 nav{display:none!important}
 nav.open{display:flex!important;position:fixed;inset:56px 0 0 0;width:auto;background:rgba(5,6,10,.97);flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:9;overflow:visible;white-space:normal}
 nav.open a{font-family:var(--serif);font-size:34px;letter-spacing:0;text-transform:none;color:var(--text);min-height:60px}
}
h1,h2{font-family:var(--serif);font-weight:400}
.eyebrow,.tag{font-family:var(--hud);font-weight:600;letter-spacing:.24em}
.grad{background:linear-gradient(90deg,#b9b4ff,#e2733d);-webkit-background-clip:text;background-clip:text;color:transparent}
/* home hero */
.hero{margin:0 -16px;min-height:calc(100svh - 56px);padding:48px 20px 40px;display:flex;flex-direction:column;justify-content:center}
.hero::before{background:linear-gradient(90deg,rgba(5,6,10,.92) 0,rgba(5,6,10,.55) 55%,rgba(5,6,10,.15) 100%),linear-gradient(180deg,rgba(5,6,10,0) 60%,var(--bg) 100%),url("apollo-11.jpg") 62% 30%/cover no-repeat}
.hero h1{font-family:var(--disp);font-weight:400;font-size:clamp(40px,12vw,88px);line-height:.98;overflow-wrap:anywhere;letter-spacing:.01em;text-transform:uppercase;margin:10px 0 0}
.hero h1 span{color:var(--text)}
.hero .rule{height:1px;background:linear-gradient(90deg,rgba(255,255,255,.55),transparent);margin:18px 0 14px;max-width:420px}
.hero .quote{font-family:var(--serif);font-style:italic;color:#d6d2c8;max-width:34ch;font-size:16px;margin:0 0 20px}
.btn.ghost{background:transparent;border:1px solid #f1efe9;border-radius:2px;font-family:var(--hud);letter-spacing:.2em;text-transform:uppercase;font-size:13px;min-height:44px}
.btn.ghost:hover{background:#f1efe9;color:#05060a}
.hud{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:0 -4px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.hud div{padding:14px 8px;text-align:center;border-right:1px solid var(--line)}
.hud div:nth-child(2n){border-right:0}
.hud div:nth-child(n+3){border-top:1px solid var(--line)}
.hud small{display:block;font-family:var(--hud);letter-spacing:.22em;font-size:11px;color:var(--amber);text-transform:uppercase}
.hud b{font-family:var(--hud);font-size:22px;font-weight:600}
@media(min-width:700px){.hud{grid-template-columns:repeat(4,1fr)}.hud div:nth-child(n+3){border-top:0}.hud div:nth-child(2n){border-right:1px solid var(--line)}.hud div:last-child{border-right:0}}
/* world filter chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
.chip{background:transparent;border:1px solid var(--line);color:var(--mute);font-family:var(--hud);letter-spacing:.16em;text-transform:uppercase;font-size:12px;min-height:40px;padding:0 16px;border-radius:99px;cursor:pointer}
.chip.on{border-color:var(--amber);color:var(--amber)}
/* editorial cards */
.card{border-radius:4px;background:transparent;border:0;border-bottom:1px solid var(--line)}
.card .img{height:230px;position:relative;filter:saturate(.9)}
.card .img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,.15),rgba(5,6,10,.6))}
.card .num{position:absolute;left:14px;top:10px;z-index:1;font-family:var(--hud);font-weight:600;letter-spacing:.2em;font-size:12px;color:#fff}
.card .num b{font-family:var(--disp);font-weight:400;font-size:28px;letter-spacing:.02em;margin-right:8px}
.card .body{padding:14px 2px 18px}
.card h3{font-family:var(--serif);font-weight:400;font-size:26px;margin:4px 0}
/* mission HUD hero */
.mhero{min-height:300px;padding:130px 22px 22px}
.mhero::after{content:"";position:absolute;inset:12px;pointer-events:none;background:
 linear-gradient(var(--amber),var(--amber)) 0 0/22px 2px no-repeat,linear-gradient(var(--amber),var(--amber)) 0 0/2px 22px no-repeat,
 linear-gradient(var(--amber),var(--amber)) 100% 0/22px 2px no-repeat,linear-gradient(var(--amber),var(--amber)) 100% 0/2px 22px no-repeat,
 linear-gradient(var(--amber),var(--amber)) 0 100%/22px 2px no-repeat,linear-gradient(var(--amber),var(--amber)) 0 100%/2px 22px no-repeat,
 linear-gradient(var(--amber),var(--amber)) 100% 100%/22px 2px no-repeat,linear-gradient(var(--amber),var(--amber)) 100% 100%/2px 22px no-repeat;opacity:.7}
.mhero h1{font-family:var(--disp);font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(34px,11vw,56px);line-height:1;background:linear-gradient(180deg,#fff,#a9a69e);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 6px}
.mhero .lead{font-family:var(--serif);font-style:italic;font-size:17px;color:#e6e2d8}
.stats{border:0;padding:0;gap:0;margin:22px 0;position:relative;background:linear-gradient(180deg,#0c0e14,#08090d);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));outline:1px solid var(--line)}
.stats>div{display:flex;flex-direction:column-reverse;padding:16px 12px;border-right:1px solid var(--line)}
.stats>div:last-child{border-right:0}
.stats small{font-family:var(--hud);letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--amber);margin-bottom:4px}
.stats b{font-family:var(--hud);font-size:26px;font-weight:600;line-height:1.1}
/* infographic facts */
ul.facts{list-style:none;padding:0;display:grid;gap:10px;counter-reset:f}
ul.facts li{counter-increment:f;margin:0;position:relative;background:linear-gradient(135deg,#141722,#0c0e14);border:1px solid var(--line);border-left:3px solid var(--amber);padding:14px 14px 14px 62px;color:#d6d2c8}
ul.facts li::before{content:counter(f,decimal-leading-zero);position:absolute;left:14px;top:8px;font-family:var(--disp);font-size:32px;color:var(--amber);opacity:.9}
ul.facts li::marker{content:""}
@media(min-width:700px){ul.facts{grid-template-columns:1fr 1fr 1fr}}
/* quiz */
.qh{display:flex;justify-content:space-between;font-family:var(--hud);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--mute);margin-top:4px}
.opt{display:flex;align-items:center;gap:14px;border-radius:6px}
.opt .lt{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:#1c1d25;display:inline-flex;align-items:center;justify-content:center;font-family:var(--hud);font-weight:700;font-size:13px}
.opt.right .lt{background:var(--ok);color:#05060a}
.opt.wrong .lt{background:var(--bad);color:#05060a}
/* passport patches */
.pgrid{background:linear-gradient(180deg,#0d1424,#0a0e18);border:1px solid #1f2a44;border-radius:14px;padding:18px 10px;gap:6px 4px;grid-template-columns:repeat(3,1fr)}
.slot{border:0;background:none;min-height:0;padding:8px 4px}
.slot.got{background:none;border:0}
.slot svg{width:92px;height:92px;display:block;margin:0 auto 6px;filter:grayscale(1) opacity(.4)}
.slot.got svg{filter:none}
.slot b{font-size:13px;font-family:var(--hud);letter-spacing:.06em;line-height:1.2}
.slot small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-family:var(--hud)}
.slot.got small{color:var(--ok)}
/* footer */
footer{background:#07080c;text-align:left;padding:30px 20px 24px}
footer .fc{display:grid;gap:22px;grid-template-columns:1fr 1fr;max-width:760px;margin:0 auto}
footer .fc .w{grid-column:1/-1}
footer h4{font-family:var(--hud);letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:var(--text);margin:0 0 8px}
footer a{display:block;color:var(--mute);text-decoration:none;font-size:13px;padding:5px 0}
footer a:hover{color:var(--text)}
footer .fb2{max-width:760px;margin:22px auto 0;border-top:1px solid var(--line);padding-top:14px;font-size:12px}
</style>

  const h=location.hash.replace(/^#/,"")||"/";
  if(h.startsWith("/story/"))story(h.slice(7));
  else if(h.startsWith("/m/"))mission(h.slice(3));
  else if(h==="/passport")passport();
  else if(h==="/credits")credits();
  else if(h==="/timeline")timeline();
  else if(h==="/map")map();
  else if(h==="/glossary")glossary();
  else home();
  app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter");
  if(h!=="missions")window.scrollTo(0,0);
  document.title="Project Afterlight";
}
window.addEventListener("hashchange",route);
route();
</script>
