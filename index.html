<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Afterlight</title>
<meta name="theme-color" content="#0a1030">
<meta name="description" content="Abandoned, but not forgotten. Six NASA missions and the science they left behind.">
<style>
:root{--bg:#0a1030;--card:#121a45;--line:#2a2f6b;--text:#eef0ff;--mute:#a9acd8;--blue:#a78bfa;--amber:#f0abfc;--ok:#3ecf8e;--bad:#e5645a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg) radial-gradient(ellipse at 50% -10%,#2b1c78 0,transparent 55%) no-repeat;color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.6}
a{color:var(--blue)}
header{position:sticky;top:0;z-index:10;background:rgba(10,16,48,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
header a.brand{color:var(--text);text-decoration:none;letter-spacing:.14em;font-weight:700;font-size:13px}
nav{display:flex;gap:14px;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;font-size:13px;padding:8px 2px;min-height:44px;display:inline-flex;align-items:center}
nav a:hover,nav a:focus{color:var(--text)}
main{max-width:760px;margin:0 auto;padding:0 16px 60px}
.eyebrow{color:var(--blue);letter-spacing:.2em;font-size:11px;text-transform:uppercase;margin:36px 0 8px}
h1{font-size:44px;line-height:1.05;margin:6px 0 12px}
h1 span{color:var(--blue)}
h2{font-size:26px;line-height:1.2;margin:6px 0 12px}
p.lead{font-size:18px}
.mute{color:var(--mute)}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid var(--blue);background:#1e1b5e;color:var(--text);text-decoration:none;border-radius:6px;font-size:15px;cursor:pointer}
.btn:focus,.opt:focus,a:focus,button:focus{outline:2px solid var(--amber);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--amber));transition:width .4s}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-decoration:none;color:var(--text);display:block}
.card .img{height:170px;background:#000 center/cover no-repeat}
.card .body{padding:14px}
.tag{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.tag.mars{color:var(--amber)}
.card h3{margin:4px 0 4px;font-size:21px}
.stamp{float:right;font-size:12px;border:1px solid var(--ok);color:var(--ok);padding:2px 8px;border-radius:99px}
figure{margin:18px 0}
figure img{width:100%;border-radius:8px;display:block;background:#000}
figcaption{font-size:13px;color:var(--mute);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:20px 0}
.stats b{display:block;font-size:22px}
.stats small{color:var(--mute);font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:10px 0;padding:0 14px}
summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:600}
details p{margin:0 0 14px;color:var(--mute)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:14px;margin:8px 0;font-size:16px;min-height:48px;cursor:pointer}
.opt.right{border-color:var(--ok);background:#0c2a20}
.opt.wrong{border-color:var(--bad);background:#2a1210}
.fb{margin:10px 0;color:var(--mute);font-size:15px}
.fb b.ok{color:var(--ok)}.fb b.no{color:var(--bad)}
.note{font-size:13px;color:var(--mute);border-top:1px solid var(--line);margin-top:30px;padding-top:14px}
footer{border-top:1px solid var(--line);padding:20px 16px;color:var(--mute);font-size:13px;text-align:center}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.slot{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;min-height:90px;display:flex;flex-direction:column;justify-content:center}
.slot.got{border:1px solid var(--ok);background:#0c2a20}
.slot .s{font-size:26px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tl{border-left:2px solid var(--line);margin:20px 0 20px 8px;padding-left:18px}
.tl .ev{position:relative;margin:0 0 22px}
.tl .ev:before{content:"";position:absolute;left:-26px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid var(--bg)}
.tl .ev.mars:before{background:var(--amber)}
.tl .yr{font-weight:700;font-size:18px}
.tl a{font-size:13px}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;min-height:44px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:15px;cursor:pointer}
.tabs button.on{border-color:var(--blue);background:#1e1b5e}
.map{width:100%;background:#070b26;border:1px solid var(--line);border-radius:10px;display:block}
.pin{cursor:pointer}
.pin:focus circle,.pin:hover circle{stroke:#fff;stroke-width:2}
.pinfo{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0;min-height:90px}
.cert{border:2px solid var(--amber);border-radius:12px;padding:24px 16px;text-align:center;background:#121a45;margin:18px 0}
.cert h2{margin:6px 0}
.cert input{background:#0a1030;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:16px;width:100%;max-width:320px;text-align:center;margin:8px 0}
dl.gl dt{font-weight:700;margin-top:16px}
dl.gl dd{margin:2px 0 0;color:var(--mute)}
ul.facts{padding-left:20px;color:var(--mute)}
ul.facts li{margin:9px 0}
ul.facts li::marker{color:var(--blue)}
.zoomable{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:72vh;border-radius:8px}
#lb p{color:var(--mute);font-size:13px;max-width:700px;text-align:center}
#lb button{position:absolute;top:12px;right:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.scene{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0;opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.scene.in{opacity:1;transform:none}
.scene h1{font-size:46px}
.scene h2{font-size:32px}
.scene .big{font-size:60px;font-weight:700;color:var(--blue);line-height:1.1}
#sp{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--blue),var(--amber));width:0;z-index:60}
@media (prefers-reduced-motion:reduce){.scene{opacity:1;transform:none}}
@media print{header,footer,.noprint{display:none!important}body{background:#fff;color:#000}.cert{background:#fff;border-color:#000;color:#000}.cert input{border:none;color:#000;background:#fff}.mute{color:#333}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header>
  <a class="brand" href="#/">PROJECT AFTERLIGHT</a>
  <nav aria-label="Main"><a href="#/">Missions</a><a href="#/timeline">Timeline</a><a href="#/map">Map</a><a href="#/passport">Passport</a><a href="#/glossary">Glossary</a><a href="#/credits">Credits</a></nav>
</header>

<script>

"apollo-11":[
"Landed July 20, 1969, in the Sea of Tranquility.",
"Left behind: the Eagle descent stage, a plaque reading \u201cWe came in peace for all mankind,\u201d a seismometer, and a laser reflector that scientists still use.",

function home(){
  const n=stamps();

  <div class="eyebrow">NASA Space Apps Challenge 2026</div>

function mission(id){
  const i=M.findIndex(x=>x.id===id); if(i<0){return home()}
  const m=M[i], next=M[(i+1)%M.length];
  app.innerHTML=`
  <p><a href="#/">&larr; All missions</a></p>
  <div class="eyebrow">Explorer 0${i+1} / ${m.where}</div>
  <h1 style="font-size:40px">${m.n}</h1>
  <p class="lead">${m.line}</p>
  <p class="mute">${m.intro}</p>
  <div class="row"><a class="btn" href="#/story/${m.id}">Story mode</a>${canSpeak?'<button class="btn" id="ls">Listen</button>':''}</div>
  <p class="mute" style="font-size:13px">Tap the photo to zoom.</p>
  <figure>${imgTag(m)}<figcaption>${m.cap}<br>Credit: ${m.credit} &middot; ${m.cid}</figcaption></figure>
  <div class="stats">${m.stats.map(s=>`<div><b>${s[0]}</b><small>${s[1]}</small></div>`).join("")}</div>
  ${factsHTML(m)}
  <div class="eyebrow">The mission in context</div>
  <h2>What remains is a story worth knowing.</h2>
  <p class="mute">${m.ctx}</p>
  <div class="eyebrow">Follow the evidence</div>
  <h2>Discoveries, not just destinations.</h2>
  ${m.ev.map(e=>`<details><summary>${e[0]}</summary><p>${e[1]}</p></details>`).join("")}
  <div class="eyebrow">A moment of discovery</div>
  <h2>Put your knowledge to the test.</h2>
  <div id="quiz"></div>
  <div class="eyebrow">The source archive</div>
  ${m.src.map(s=>`<p><a href="${s[1]}" target="_blank" rel="noopener">${s[0]} &#8599;</a></p>`).join("")}
  <p><a class="btn" href="#/m/${next.id}">Next: ${next.n} &rarr;</a></p>`;
  quiz(m);
  const ls=document.getElementById("ls");if(ls)ls.onclick=()=>speakText(mText(m),ls);
}
function quiz(m){
  let qi=0,score=0;const box=document.getElementById("quiz");
  function show(){
    if(qi>=m.q.length){
      const won=score>=3; if(won){mem[m.id]=true;save(mem)}
      box.innerHTML=`<p class="lead"><b>${score} of ${m.q.length}</b></p><p class="fb">${won?'<b class="ok">Stamp earned.</b> Open your <a href="#/passport">passport</a> to see it.':'You need 3 or more for the stamp.'}</p><button class="btn" id="again">Try again</button>`;
      document.getElementById("again").onclick=()=>{qi=0;score=0;show()};return;
    }
    const q=m.q[qi];
    box.innerHTML=`<div class="tag">Question ${qi+1} of ${m.q.length}</div><p class="lead">${q[0]}</p>`+q[1].map((o,k)=>`<button class="opt" data-k="${k}">${String.fromCharCode(65+k)} &nbsp; ${o}</button>`).join("")+`<div class="fb" id="fb" aria-live="polite"></div>`;
    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, ok=k===q[2]; if(ok)score++;
      box.querySelectorAll(".opt").forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add("right");else if(x===b)x.classList.add("wrong")});
      document.getElementById("fb").innerHTML=(ok?'<b class="ok">Correct.</b> ':'<b class="no">Not quite.</b> ')+q[3]+'<br><br><button class="btn" id="nx">'+(qi===m.q.length-1?"See score":"Next question")+'</button>';
      document.getElementById("nx").onclick=()=>{qi++;show()};
    });
  }
  show();
}
function passport(){
  const n=stamps();
  app.innerHTML=`<div class="eyebrow">Explorer passport</div><h1 style="font-size:36px">${n} of 6 missions explored</h1>
  <div class="bar"><i style="width:${n/6*100}%"></i></div>
  <p class="mute">Score 3 or more on a mission quiz to earn its stamp. Progress is saved in this browser.</p>
  <div class="pgrid">${M.map(m=>`<a class="slot ${mem[m.id]?'got':''}" href="#/m/${m.id}" style="text-decoration:none;color:inherit"><div class="s">${mem[m.id]?'&#9733;':'&#9734;'}</div><b>${m.n}</b><small class="mute">${mem[m.id]?'Stamped':'Not yet'}</small></a>`).join("")}</div>
  ${n===6?'<div class="cert"><div class="tag">Project Afterlight</div><h2>Explorer Certificate</h2><p class="mute">This certifies that</p><input id="nm" placeholder="Type your name" aria-label="Your name" maxlength="40"><p class="mute">explored all six missions: Apollo 11, Surveyor 3, Opportunity, Spirit, Sojourner and Voyager 1.</p><p class="mute">Abandoned, but not forgotten.</p></div><p class="noprint"><button class="btn" id="pr">Print or save as PDF</button></p>':''}
  <p class="noprint"><button class="btn" id="reset">Reset passport</button></p>`;
  const pr=document.getElementById("pr");if(pr)pr.onclick=()=>window.print();
  document.getElementById("reset").onclick=()=>{if(confirm("Reset all stamps?")){mem={};save(mem);passport()}};
}
function credits(){
  app.innerHTML=`<div class="eyebrow">Credits</div><h1 style="font-size:36px">Sources and credits</h1>
  <p class="mute">This independent educational project is not affiliated with NASA. Images and facts are from NASA sources.</p>
  <table><tr><th>NASA ID</th><th>Image</th><th>Credit</th></tr>${CREDITS.map(c=>`<tr><td>${c[0]}</td><td>${c[1]}</td><td>${c[2]}</td></tr>`).join("")}</table>
  <p class="note">Mission facts are drawn from NASA mission pages linked at the bottom of each mission. This site was built with the help of an AI assistant (Claude by Anthropic) for code and writing support; facts were checked against NASA sources.</p>`;
}
const TL=[
["1967","April 19","Surveyor 3 soft-lands in the Ocean of Storms.","surveyor-3","moon"],
["1969","July 20","Apollo 11 astronauts deploy the Early Apollo Scientific Experiments Package.","apollo-11","moon"],
["1969","November 20","Apollo 12 astronauts Conrad and Bean examine Surveyor 3.","surveyor-3","moon"],
["1977","September 5","Voyager 1 launches from Cape Canaveral.","voyager-1","space"],
["1997","September 27","The final data transmission from Mars Pathfinder, carrier of Sojourner, arrives.","sojourner","mars"],
["1998","March 10","The Sojourner / Pathfinder mission is ended.","sojourner","mars"],
["2004","January","Spirit lands in Gusev Crater; Opportunity lands at Meridiani Planum on January 25 (UTC).","opportunity","mars"],
["2009","May 1","Spirit becomes stuck in soft soil.","spirit","mars"],
["2010","March 22","Last contact with Spirit.","spirit","mars"],
["2011","May 25","NASA ends recovery efforts for Spirit.","spirit","mars"],
["2012","","Voyager 1 crosses the heliopause into interstellar space.","voyager-1","space"],
["2018","June 10","Opportunity's last communication, during a planet-wide dust storm.","opportunity","mars"],
["2019","February 13","NASA declares the Opportunity mission complete.","opportunity","mars"]
];
const NAMES=Object.fromEntries(M.map(m=>[m.id,m.n]));
function timeline(){
  app.innerHTML=`<div class="eyebrow">Timeline</div><h1 style="font-size:36px">1967 to today</h1>
  <p class="mute">Thirteen moments across the Moon, Mars and deep space. Tap a mission to read its story.</p>
  <div class="tl">${TL.map(t=>`<div class="ev ${t[4]==="mars"?"mars":""}"><div class="yr">${t[0]}${t[1]?' &middot; '+t[1]:''}</div><div class="mute">${t[2]}</div><a href="#/m/${t[3]}">${NAMES[t[3]]} &rarr;</a></div>`).join("")}</div>`;
}
const PINS={
moon:[["Apollo 11","apollo-11",0.67,23.47,"Tranquility Base. The seismometer and laser-ranging reflector were left here."],["Surveyor 3","surveyor-3",-3.01,-23.42,"Ocean of Storms. Apollo 12 landed within 600 feet of it."]],
mars:[["Sojourner / Pathfinder","sojourner",19.13,-33.22,"Ares Vallis region. Planned for 7 days, worked 83."],["Opportunity","opportunity",-1.95,-5.53,"Meridiani Planum. Landed January 25, 2004 (UTC)."],["Spirit","spirit",-14.57,175.47,"Gusev Crater. Stuck in soft soil on May 1, 2009."]]
};
function map(){
  app.innerHTML=`<div class="eyebrow">Where is it now?</div><h1 style="font-size:36px">Landing sites</h1>
  <p class="mute">A simple schematic of longitude and latitude (not satellite imagery). Tap a pin.</p>
  <div class="tabs" role="tablist"><button id="tm" class="on">Moon</button><button id="tr">Mars</button></div>
  <svg id="svg" class="map" viewBox="0 0 360 180" role="img" aria-label="Schematic map of landing sites"></svg>
  <div class="pinfo" id="pi" aria-live="polite"><span class="mute">Select a pin to see what was left there.</span></div>
  <p class="note">Voyager 1 is not on a map: it left the planets behind. Coordinates are approximate.</p>`;
  const svg=document.getElementById("svg"),pi=document.getElementById("pi");
  function draw(w){
    const col=w==="moon"?"#a78bfa":"#f0abfc";
    let g='<rect width="360" height="180" fill="#070b26"/>';
    for(let x=0;x<=360;x+=30)g+=`<line x1="${x}" y1="0" x2="${x}" y2="180" stroke="#2a2f6b" stroke-width=".5"/>`;
    for(let y=0;y<=180;y+=30)g+=`<line x1="0" y1="${y}" x2="360" y2="${y}" stroke="#2a2f6b" stroke-width=".5"/>`;
    g+=`<line x1="0" y1="90" x2="360" y2="90" stroke="#3b3f8a" stroke-width=".8"/><line x1="180" y1="0" x2="180" y2="180" stroke="#3b3f8a" stroke-width=".8"/>`;
    g+=`<text x="4" y="86" fill="#8a8fd0" font-size="6">Equator</text><text x="183" y="8" fill="#8a8fd0" font-size="6">0° longitude</text>`;
    PINS[w].forEach((p,i)=>{const x=p[3]+180,y=90-p[2];
      g+=`<g class="pin" tabindex="0" role="button" aria-label="${p[0]}" data-w="${w}" data-i="${i}"><circle cx="${x}" cy="${y}" r="6" fill="${col}" stroke="#070b26"/><text x="${x+9}" y="${y+3}" fill="#eef0ff" font-size="8">${p[0]}</text></g>`});
    svg.innerHTML=g;
    svg.querySelectorAll(".pin").forEach(el=>{const f=()=>{const p=PINS[el.dataset.w][el.dataset.i];pi.innerHTML=`<b>${p[0]}</b><p class="mute">${p[4]}</p><a href="#/m/${p[1]}">Read the story &rarr;</a>`};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
  }
  draw("moon");
  document.getElementById("tm").onclick=()=>{draw("moon");tm.className="on";tr.className="";pi.innerHTML='<span class="mute">Select a pin.</span>'};
  document.getElementById("tr").onclick=()=>{draw("mars");tr.className="on";tm.className="";pi.innerHTML='<span class="mute">Select a pin.</span>'};
}
const GL=[
["Sol","A Martian day, about 24 hours 39 minutes long. Rover missions are counted in sols."],
["Heliopause","The boundary where the Sun's wind gives way to interstellar space. Voyager 1 crossed it in 2012."],
["APXS","Alpha Proton X-ray Spectrometer. Sojourner's tool for measuring the chemistry of rocks."],
["Retroreflector","A mirror array that sends light straight back to its source. Apollo 11's has 100 corner cubes and needs no power."],
["Seismometer","An instrument that detects ground shaking, such as moonquakes."],
["Soft landing","Touching down gently enough that the spacecraft survives, as Surveyor 3 did."],
["Golden Record","A record carried by Voyager with 115 images of Earth, plus sounds and greetings."],
["Spherules","Tiny round mineral grains. Opportunity's 'blueberries' are an example."],
["EASEP","Early Apollo Scientific Experiments Package, the instruments Apollo 11 left on the Moon."]
];
function glossary(){
  app.innerHTML=`<div class="eyebrow">Glossary</div><h1 style="font-size:36px">Words worth knowing</h1><dl class="gl">${GL.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl>`;
}
const lb=document.getElementById("lb"),lbi=lb.querySelector("img"),lbp=lb.querySelector("p"),sp=document.getElementById("sp");
function openLb(src,alt,cap){lbi.setAttribute("src",src);lbi.alt=alt;lbp.textContent=cap;lb.classList.add("on");document.getElementById("lbx").focus()}
function closeLb(){lb.classList.remove("on");lbi.removeAttribute("src")}
document.getElementById("lbx").onclick=closeLb;
lb.addEventListener("click",e=>{if(e.target===lb)closeLb()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb();const t=e.target;if((e.key==="Enter"||e.key===" ")&&t&&t.dataset&&t.dataset.zoom){e.preventDefault();t.click()}});
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("[data-zoom]");if(t)openLb(t.getAttribute("src"),t.alt,t.dataset.cap||"")});
const canSpeak="speechSynthesis" in window;
function stopSpeak(){if(canSpeak)speechSynthesis.cancel()}
function speakText(t,btn){if(!canSpeak)return;if(speechSynthesis.speaking){speechSynthesis.cancel();btn.textContent="Listen";return}
  const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=0.95;u.onend=()=>{btn.textContent="Listen"};speechSynthesis.speak(u);btn.textContent="Stop"}
function mText(m){return m.n+". "+m.line+" "+m.intro+" "+m.ctx+" "+(FACTS[m.id]||[]).join(" ")+" "+m.ev.map(e=>e[0]+". "+e[1]).join(" ")}
function story(id){
  const i=M.findIndex(x=>x.id===id);if(i<0)return home();
  const m=M[i],next=M[(i+1)%M.length],sc=[];
  sc.push(`<div class="tag ${m.where==="Mars"?"mars":""}">Explorer 0${i+1} &middot; ${m.where}</div><h1>${m.n}</h1><p class="lead">${m.line}</p>${canSpeak?'<div class="row"><button class="btn" id="ls">Listen to this story</button></div>':''}<p class="mute">Scroll to begin &darr;</p>`);
  sc.push(`<p class="lead">${m.intro}</p>`);
  sc.push(`<figure>${imgTag(m)}<figcaption>${m.cap}<br>Credit: ${m.credit} &middot; ${m.cid}. Tap the photo to zoom.</figcaption></figure>`);
  m.stats.forEach(t=>sc.push(`<div class="big">${t[0]}</div><p class="lead">${t[1]}</p>`));
  sc.push(factsHTML(m));
  sc.push(`<div class="tag">The mission in context</div><p class="lead">${m.ctx}</p>`);
  m.ev.forEach(e=>sc.push(`<div class="tag">Follow the evidence</div><h2>${e[0]}</h2><p class="lead mute">${e[1]}</p>`));
  sc.push(`<h2>What remains is a story worth knowing.</h2><p class="mute">Now test what you learned and earn the stamp.</p><div class="row"><a class="btn" href="#/m/${m.id}">Take the quiz</a><a class="btn" href="#/story/${next.id}">Next story: ${next.n} &rarr;</a></div>`);
  app.innerHTML=`<p><a href="#/m/${m.id}">&larr; Mission page</a></p>`+sc.map(h=>`<section class="scene">${h}</section>`).join("");
  const scenes=app.querySelectorAll(".scene");
  if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add("in")}),{threshold:.2});scenes.forEach(x=>io.observe(x))}
  else scenes.forEach(x=>x.classList.add("in"));
  const ls=document.getElementById("ls");if(ls)ls.onclick=()=>speakText(mText(m),ls);
}
window.addEventListener("scroll",()=>{if(location.hash.indexOf("#/story/")===0){const h=document.documentElement.scrollHeight-window.innerHeight;sp.style.width=(h>0?Math.min(100,window.scrollY/h*100):0)+"%"}});
function route(){
  stopSpeak();closeLb();sp.style.width="0";
  const h=location.hash.replace(/^#/,"")||"/";
  if(h.startsWith("/story/"))story(h.slice(7));
  else if(h.startsWith("/m/"))mission(h.slice(3));
  else if(h==="/passport")passport();
  else if(h==="/credits")credits();
  else if(h==="/timeline")timeline();
  else if(h==="/map")map();
  else if(h==="/glossary")glossary();
  else home();
  if(h!=="missions")window.scrollTo(0,0);
  document.title="Project Afterlight";
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
